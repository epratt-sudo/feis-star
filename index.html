<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Feis Star</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Figtree:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
/* Layout: a feis stage at night. Velvet backdrop, one gold-embroidered dancer card, play lanes laid out like stage boards. */
:root{
  --velvet:#15111f; --glow:#2b2044; --panel:#1f1830; --panel2:#2a2140; --line:#3b3155;
  --ink:#f4ede0; --muted:#b3a8c4; --gold:#e2b95c; --gold2:#f6dd9c; --crystal:#a9e4ff;
  --rose:#ef7aa0; --mint:#7ee0a6; --bad:#ff8f7f; --onGold:#24180a;
  --display:'Uncial Antiqua', Georgia, 'Times New Roman', serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'Spline Sans Mono', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--velvet) radial-gradient(1100px 520px at 50% -160px, var(--glow) 0%, transparent 70%) no-repeat;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--crystal);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:34px}
.brand span{font-family:var(--display);font-size:22px;color:var(--gold2)}
.top-right{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.chip .cr{color:var(--crystal)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600}
.iconbtn:hover{border-color:var(--gold)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--gold);color:var(--onGold);transition:transform .12s, background .12s}
.btn:hover{background:var(--gold2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:7px 12px;font-size:14px;border-radius:8px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}

/* title */
.title{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;align-items:center;padding-top:24px}
.title h1{font-size:clamp(48px,9vw,92px);color:var(--gold2);letter-spacing:.01em}
.title .lede{font-size:17px;max-width:56ch;margin-top:12px;color:var(--ink)}
.title-art canvas{width:100%;aspect-ratio:200/320;max-width:300px;display:block}
.newform{margin-top:24px;display:grid;gap:16px;max-width:520px}
.field label.lab{display:block;font-weight:700;margin-bottom:6px}
.field input[type=text]{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:36px;height:36px;border-radius:50%;border:3px solid var(--panel2)}
.swatches input:checked + span{border-color:var(--gold)}
.swatches input:focus-visible + span{outline:2px solid var(--crystal);outline-offset:2px}
.continue{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hub */
.hub>*{min-width:0}
.hub{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
.dancer-card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:16px;padding:18px;border:1px solid var(--gold);box-shadow:0 0 0 4px var(--velvet),0 0 0 5px rgba(226,185,92,.5);text-align:center}
.dancer-card canvas{width:100%;max-width:220px;aspect-ratio:200/320;display:block;margin:0 auto}
.dancer-card h2{font-size:26px;margin-top:6px;color:var(--gold2);overflow-wrap:anywhere}
.grade-badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:rgba(226,185,92,.14);color:var(--gold2);font-weight:700;font-size:13px;letter-spacing:.04em}
.presence{margin-top:12px;font-size:14px;color:var(--muted)}
.presence b{color:var(--crystal);font-family:var(--mono)}
.prog{margin-top:14px;text-align:left;font-size:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.wonrow{display:flex;flex-wrap:wrap;gap:6px}
.wontag{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.wontag.on{border-color:var(--mint);color:var(--mint)}

.ladder{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.ladder li{flex:1 0 auto;min-width:86px;padding:8px 8px 7px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;line-height:1.25;color:var(--muted)}
.ladder li b{display:block;font-family:var(--mono);font-size:11px;opacity:.8}
.ladder li.done{color:var(--ink);border-color:rgba(126,224,166,.4)}
.ladder li.done b{color:var(--mint)}
.ladder li.here{background:var(--gold);color:var(--onGold);border-color:var(--gold);font-weight:700}
.ladder li.here b{color:var(--onGold)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected=true]{background:var(--panel2);color:var(--ink);border-color:var(--gold)}
.board-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.board-head h3{font-size:28px;color:var(--gold2)}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.comp{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:2px;transition:border-color .12s, transform .12s}
.comp:hover{border-color:var(--gold);transform:translateY(-2px)}
.comp strong{font-size:18px}
.comp .shoe{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.comp .shoe.soft{color:var(--crystal)} .comp .shoe.hard{color:var(--rose)} .comp .shoe.champ{color:var(--gold)}
.comp .meta{font-size:13px;color:var(--muted)}
.comp .won{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;color:var(--mint);border:1px solid var(--mint);border-radius:999px;padding:1px 8px}
.comp.big{grid-column:1/-1;padding:18px}
.comp.big strong{font-size:22px;font-family:var(--display);font-weight:400;color:var(--gold2)}
.practice{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:12px}
.practice select{padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.practice p{flex:1 1 220px;font-size:14px;color:var(--muted)}

.slots{display:grid;gap:18px}
.slot h4{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.item.on{border-color:var(--gold)}
.item svg{width:44px;height:44px}
.item .nm{font-weight:600;line-height:1.25}
.item .sub{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:6px}

.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.trophy{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px}
.trophy svg{width:64px;height:72px;display:block;margin:0 auto 6px}
.trophy b{display:block;font-size:13px;line-height:1.25}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* play */
.play-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.play-head h2{font-size:clamp(28px,5vw,40px);color:var(--gold2)}
.hud{display:flex;gap:8px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:84px}
.hud span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud b{font-family:var(--mono);font-size:20px}
#stagecv{width:100%;height:clamp(150px,27vh,250px);display:block;border-radius:14px;border:1px solid var(--line);margin-bottom:10px}
#lanes{width:100%;height:min(44vh,440px);display:block;border-radius:14px;border:1px solid var(--line);touch-action:none}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pad{height:66px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:grid;place-items:center;line-height:1.1}
.pad small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.pad.hit{background:var(--panel2)}
.keys{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

/* screens */
.center{max-width:720px;margin:0 auto}
.pick fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 0}
.pick legend{padding:0 6px;font-weight:700}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--panel2);cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.res{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:start}
.res .rosette svg{width:100%;max-width:200px;display:block;margin:0 auto}
.res h2{font-size:clamp(28px,5vw,40px);color:var(--gold2)}
.prizes{display:grid;gap:8px;margin-top:16px}
.prize{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px}
.prize svg{width:40px;height:44px;flex:none}
.tablewrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
tr.you td{color:var(--gold2);font-weight:700}
.banner{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--mint);color:var(--mint);font-weight:600}

/* studio */
.studio-top{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.act h4{margin:0;font-size:16px}
.act p{font-size:13px;color:var(--muted)}
.act select{padding:8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--crystal)}
.ms{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ms li{font-size:14px;color:var(--muted);padding-left:24px;position:relative}
.ms li::before{content:"";position:absolute;left:4px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.ms li.ok{color:var(--ink)} .ms li.ok::before{background:var(--mint);border-color:var(--mint)}
.log{font-size:14px;display:grid;gap:4px;max-height:220px;overflow:auto}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;border-radius:10px;font-weight:600;max-width:min(92vw,520px);z-index:20;text-align:center}

@media (max-width:820px){
  .hub{grid-template-columns:minmax(0,1fr)}
  .dancer-card{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;text-align:left;align-items:center}
  .dancer-card canvas{max-width:130px}
  .prog{grid-column:1/-1}
  .two{grid-template-columns:1fr}
}
@media (max-width:700px){
  .title{grid-template-columns:1fr;gap:10px;padding-top:4px}
  .title-art canvas{max-width:170px;margin:0 auto}
  .stage{grid-template-columns:1fr}
  #mini{display:none}
  .pads{margin-left:0}
  #stagecv{height:clamp(140px,22vh,200px)}
  #lanes{height:min(40vh,380px)}
  .res{grid-template-columns:1fr}
  .res .rosette svg{max-width:150px}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hud div{min-width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Feis Star home">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#e2b95c" stroke-width="6" stroke-linecap="round"><path d="M50 14 C 78 40, 70 74, 26 70"/><path d="M50 14 C 22 40, 30 74, 74 70"/><path d="M26 70 C 40 46, 60 46, 74 70"/><circle cx="50" cy="56" r="30" stroke-width="3" opacity=".55"/></g></svg>
      <span>Feis Star</span>
    </button>
    <div class="top-right">
      <span class="chip" id="crystals" hidden><span class="cr">✦</span><span class="mono" id="crn">0</span></span>
      <button class="iconbtn" id="mute" data-act="mute" aria-pressed="false">Sound on</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r=Math.random){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th');
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------- game data ---------- */
const GRADES=['Beginner','Advanced Beginner','Novice','Open Prizewinner','Preliminary Championship','Open Championship'];
const MEAN=[70,73,76,78.5,80.5,82.5,84.5];
const WIN_NEED=[5,5,3,3];
const FEIS=['Feis Nashua','Seacoast Feis','Boston Feis','Feis Manchester','Green Mountain Feis','Portland Feis','Feis Worcester','Cape Cod Feis','Hartford Feis','Feis Concord','Lowell Feis','Feis Providence'];
const TRAD_SETS=[["St. Patrick's Day",'jig',0],['The Blackbird','hp',1],['Jockey to the Fair','jig',1],['Job of Journeywork','hp',2],['Garden of Daisies','hp',2],['Three Sea Captains','jig',3],['King of the Fairies','hp',3]];
const OPEN_SETS=[['Planxty Davis','hp'],['The Hunt','jig'],['Rambling Rake','jig'],['Lodge Road','hp']];
const FIRST=['Aoife','Saoirse','Niamh','Ciara','Róisín','Maeve','Clodagh','Orla','Caoimhe','Eimear','Sinéad','Fiadh','Ciarán','Oisín','Darragh','Cormac','Tadhg','Nora','Grace','Ella','Maya','Lily','Emma','Liam','Rory','Brigid','Molly','Declan','Áine','Keira'];
const SCHOOLS=['Rince Academy','McGrath School','Celtic Steps','Scoil Rince Lir','Hennessy Academy','Taylor School','Boston Céilí Club','Doyle Academy','Rince na Mara','O\'Shea School'];
const D={
  reel:{name:'Reel',shoe:'soft',meter:'4/4',bpb:4,sub:2,swing:.08,bpm:l=>l<2?122:113},
  light:{name:'Light Jig',shoe:'soft',meter:'6/8',bpb:2,sub:3,bpm:()=>116},
  slip:{name:'Slip Jig',shoe:'soft',meter:'9/8',bpb:3,sub:3,bpm:l=>l<2?122:113},
  treble:{name:'Treble Jig',shoe:'hard',meter:'6/8',bpb:2,sub:3,bpm:l=>l<4?92:73},
  hornpipe:{name:'Hornpipe',shoe:'hard',meter:'4/4',bpb:4,sub:2,swing:.33,bpm:l=>l<4?138:113},
};
const DANCE_KEYS=['reel','light','slip','treble','hornpipe','set'];
function spec(key,lv,piece){
  if(key!=='set'){const d=D[key];return{key,name:d.name,shoe:d.shoe,meter:d.meter,bpb:d.bpb,sub:d.sub,swing:d.swing||0,bpm:d.bpm(lv),label:d.shoe==='soft'?'Soft shoe':'Hard shoe'}}
  const jig=piece[1]==='jig';
  return{key:'set',name:piece[0],shoe:'hard',meter:jig?'6/8':'4/4',bpb:jig?2:4,sub:jig?3:2,swing:jig?0:.33,bpm:jig?(lv<4?94:76):(lv<4?138:113),label:lv>=4?'Set dance':'Traditional set'};
}
const tradPiece=g=>{const o=TRAD_SETS.filter(s=>s[2]<=g);return o[S.week%o.length]};

const ITEMS=[
  {id:'class',slot:'dress',name:'Class Costume',price:0,g:0,b:0,base:'#1d6b52',acc:'#efd9a0',cape:true,own:true},
  {id:'blush',slot:'dress',name:'Blush Velvet Solo',price:120,g:2,b:2,base:'#c95583',acc:'#ffd6e6',solo:true},
  {id:'sapph',slot:'dress',name:'Sapphire Knotwork Solo',price:220,g:2,b:3,base:'#2b47b5',acc:'#b9cdff',solo:true},
  {id:'ruby',slot:'dress',name:'Ruby Sequin Solo',price:340,g:3,b:4,base:'#a8173c',acc:'#ffc0c8',solo:true},
  {id:'emer',slot:'dress',name:'Emerald Lattice Solo',price:420,g:3,b:5,base:'#0d7d58',acc:'#c8f7de',solo:true},
  {id:'galaxy',slot:'dress',name:'Midnight Galaxy Solo',price:600,g:4,b:6,base:'#2e1f66',acc:'#c7b3ff',solo:true},
  {id:'ice',slot:'dress',name:'Ice Crystal Solo',prize:'Win a Regional Oireachtas',g:2,b:7,base:'#7fc0da',acc:'#ffffff',solo:true},
  {id:'goldlame',slot:'dress',name:'Gold Lamé Champion Solo',prize:'Win the World Championships',g:2,b:8,base:'#b8892a',acc:'#fff1c4',solo:true},

/* ---------- audio: a small céilí band (fiddle, button accordion, piano vamp, bodhrán) ---------- */
let ac=null,master=null,noiseBuf=null,muted=false;const BUS={};
function ensureAudio(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
    master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(comp);comp.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*0.2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const len=Math.floor(ac.sampleRate*2.2),ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const x=ir.getChannelData(c);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
    const verb=ac.createConvolver();verb.buffer=ir;const wet=ac.createGain();wet.gain.value=0.3;verb.connect(wet);wet.connect(master);
    const flt=(type,f,q=0.7,gain=0)=>{const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.gain.value=gain;return b};
    const bus=(chain,vol,send)=>{const g=ac.createGain();g.gain.value=vol;let n=g;for(const f of chain){n.connect(f);n=f}n.connect(master);const s=ac.createGain();s.gain.value=send;n.connect(s);s.connect(verb);return g};
    BUS.fiddle=bus([flt('highpass',190),flt('peaking',480,1.1,4),flt('peaking',1150,1.4,2),flt('peaking',3200,1,-6),flt('lowpass',3400,0.6)],1,0.45);
    BUS.box=bus([flt('highpass',150),flt('lowpass',1700,0.5),flt('peaking',650,1,2)],0.8,0.3);
    BUS.piano=bus([flt('lowpass',2400,0.6),flt('peaking',220,1,2)],1,0.35);
    BUS.drum=bus([flt('lowpass',1100,0.7)],1,0.18);
  }
  if(ac.state==='suspended')ac.resume();
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function fiddle(t,m,dur,g){
  const f=mf(m),ts=g?t-0.04:t,o=ac.createOscillator(),gn=ac.createGain();o.type='sawtooth';
  if(g)o.frequency.setValueAtTime(mf(g),ts);o.frequency.setValueAtTime(f,t);
  if(dur>0.22){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*0.005,t+dur*0.7);l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.1)}
  gn.gain.setValueAtTime(0.0001,ts);gn.gain.linearRampToValueAtTime(0.06,ts+0.02);gn.gain.setTargetAtTime(0.042,ts+0.025,0.06);gn.gain.setTargetAtTime(0.0001,t+dur*0.92,0.025);
  o.connect(gn);gn.connect(BUS.fiddle);o.start(ts);o.stop(t+dur+0.2);
}
function box(t,m,dur){
  const gn=ac.createGain();for(const dt of[-9,9]){const o=ac.createOscillator();o.type='square';o.frequency.value=mf(m);o.detune.value=dt;o.connect(gn);o.start(t);o.stop(t+dur+0.15)}
  gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(0.02,t+0.012);gn.gain.setTargetAtTime(0.014,t+0.02,0.05);gn.gain.setTargetAtTime(0.0001,t+dur*0.9,0.02);gn.connect(BUS.box);
}
function piano(t,ns,dur,v){
  for(const m of ns){const f=mf(m),gn=ac.createGain(),o=ac.createOscillator(),o2=ac.createOscillator(),g2=ac.createGain();
    o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=0.35;o2.connect(g2);g2.connect(gn);o.connect(gn);
    gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(v*0.35,t+0.09);gn.gain.exponentialRampToValueAtTime(0.0003,t+Math.max(0.25,dur));
    gn.connect(BUS.piano);o.start(t);o2.start(t);o.stop(t+Math.max(0.25,dur)+0.05);o2.stop(t+Math.max(0.25,dur)+0.05)}
}
function drum(t,v){
  const o=ac.createOscillator(),g=ac.createGain(),big=v>0.5;o.type='sine';o.frequency.setValueAtTime(big?105:150,t);o.frequency.exponentialRampToValueAtTime(big?52:90,t+0.12);
  g.gain.setValueAtTime(0.5*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+(big?0.3:0.08));o.connect(g);g.connect(BUS.drum);o.start(t);o.stop(t+0.32);
  const s=ac.createBufferSource();s.buffer=noiseBuf;const ng=ac.createGain();ng.gain.setValueAtTime(0.14*v,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.045);s.connect(ng);ng.connect(BUS.drum);s.start(t);s.stop(t+0.06);
}
function tap(hard,lane){
  if(!ac)return;const t=ac.currentTime;const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter(),g=ac.createGain();
  if(hard){f.type='bandpass';f.frequency.value=lane===2?1700:1300;f.Q.value=1.4;g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.03);const o=ac.createOscillator(),og=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(lane===2?620:480,t);o.frequency.exponentialRampToValueAtTime(lane===2?340:260,t+0.05);og.gain.setValueAtTime(0.14,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.07);o.connect(og);og.connect(master);o.start(t);o.stop(t+0.08)}
  else{f.type='lowpass';f.frequency.value=700;g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06)}
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.08);
}

/* ---------- tune + chart generation ---------- */
// D major over two octaves; tunes follow D-G-A chord progressions with arpeggios, runs, repeated phrases and cuts.
const SC=[62,64,66,67,69,71,73,74,76,78,79,81,83,85,86];
const CH={D:[2,6,9],G:[7,11,2],A:[9,1,4],Em:[4,7,11]};
const ROOT={D:38,G:43,A:45,Em:40};
const VAMP={D:[57,62,66],G:[59,62,67],A:[57,61,64],Em:[59,64,67]};
const PROGS=[['D','G','D','A','D','G','A','D'],['D','D','G','D','Em','G','A','D']];
const inCh=(i,ch)=>CH[ch].includes(SC[i]%12);
function genPart(r,sp,prog,lo){
  const hi=lo+10,bars=[];let idx=lo+4;
  const clamp=v=>Math.max(lo,Math.min(hi,v));
  const near=(ch,from,end)=>{const c=[];for(let i=lo;i<=hi;i++)if(end?SC[i]%12===2:inCh(i,ch))c.push(i);c.sort((a,b)=>Math.abs(a-from)-Math.abs(b-from));return c[(r()<.7||c.length<2)?0:1]};
  for(let bar=0;bar<8;bar++){
    if(bar===4||bar===5){const src=bars[bar-4];bars.push({a:src.a.slice(),o:src.o.slice()});idx=src.a[src.a.length-1];continue}
    const ch=prog[bar],a=[],o=[];
    for(let b=0;b<sp.bpb;b++){
      const end=bar===7&&b===sp.bpb-1;
      const t=near(ch,idx+(r()<.5?1:-1),end);a.push(t);o.push(!end&&r()<.25);idx=t;
      for(let k=1;k<sp.sub;k++){
        if(end){a.push(t);o.push(false);continue}
        const m=r();let n;
        if(m<.5)n=clamp(idx+(idx>=hi-1?-1:idx<=lo+1?1:(r()<.5?1:-1)));
        else if(m<.85){const dir=idx>lo+6?-1:1;n=idx;do{n+=dir}while(n>lo&&n<hi&&!inCh(n,ch));n=clamp(n)}
        else n=idx;
        a.push(n);o.push(false);idx=n;
      }
    }
    bars.push({a,o});
  }
  return bars;
}
function buildChart(sp,lv,seed){
  const r=mulberry(seed);
  const beat=60/sp.bpm,slot=beat/sp.sub,spb=sp.bpb*sp.sub,barDur=beat*sp.bpb;
  const lead=Math.max(Math.ceil(4/sp.bpb),Math.ceil(2.4/barDur));
  const bars=Math.max(8,Math.round(34/barDur/8)*8);
  const total=lead+bars;
  const lilt=sp.sub===2?[0,sp.swing||0]:[0,.08,.04];
  const T=(bar,s)=>bar*barDur+s*slot+lilt[s%sp.sub]*slot;
  const parts=[genPart(r,sp,PROGS[0],0),genPart(r,sp,PROGS[1],3)];
  const music=[],vamp=[],beats=[],drums=[];
  for(let bar=0;bar<total;bar++){
    let pb,ch;
    if(bar<lead){const k=(8-lead+bar+8)%8;pb=parts[0][k];ch=PROGS[0][k]}else{const b=bar-lead,p=Math.floor(b/8)%2;pb=parts[p][b%8];ch=PROGS[p][b%8]}
    const last=bar===total-1;
    for(let s=0;s<spb;s++){
      if(last&&s>0)break;
      const t=T(bar,s),nt=s+1<spb?T(bar,s+1):(bar+1)*barDur;
      music.push({t,m:last?74:SC[pb.a[s]],d:last?barDur*0.9:Math.max(0.06,(nt-t)*0.95),g:(!last&&pb.o[s])?SC[Math.min(14,pb.a[s]+2)]:0});
    }
    for(let b=0;b<sp.bpb;b++){
      const t=bar*barDur+b*beat;beats.push({t,down:b===0});
      if(last){if(b===0){vamp.push({t,n:[ROOT.D,ROOT.D+12],d:barDur*0.9,v:0.12},{t,n:VAMP.D,d:barDur*0.9,v:0.05});drums.push({t,v:1})}continue}
      const bassBeat=sp.bpb===4?b%2===0:b===0;
      if(bassBeat)vamp.push({t,n:[ROOT[ch]+(sp.bpb===4&&b===2?7:0)],d:beat*0.85,v:0.13});
      else vamp.push({t,n:VAMP[ch],d:beat*0.5,v:0.045});
      drums.push({t,v:b===0?1:0.6});
      for(let k=1;k<sp.sub;k++)if(r()<.45)drums.push({t:T(bar,b*sp.sub+k),v:0.22});
    }
  }
  const leadBeats=beats.filter(b=>b.t<lead*barDur-1e-6).slice(-4);
  const counts=leadBeats.map((b,i)=>({t:b.t,label:['5','6','7','8'][i]}));
  const dens=[.14,.24,.36,.48,.58,.68,.76][lv];
  const trebleP=[0,.12,.18,.24,.3,.36,.42][lv];
  let notes=[],foot=0;
  for(let b=0;b<bars;b++){
    const bar=lead+b,last=b===bars-1;
    for(let s=0;s<spb;s++){
      if(last&&s>0)break;
      const t=T(bar,s),isBeat=s%sp.sub===0;
      let p=isBeat?.9:dens;if(b%8===7&&s>=spb/2)p*=.35;if(last)p=1;
      if(r()>=p)continue;
      if(sp.shoe==='hard'&&lv>=1&&isBeat&&!last&&b>0&&r()<trebleP){notes.push({t:t-slot/2,l:2},{t,l:2});continue}
      let l;
      if(sp.shoe==='soft'&&s===0&&r()<.1+.02*lv)l=2;
      else if(!isBeat&&r()<(sp.shoe==='hard'?.13:.1))l=3;
      else{l=foot;foot=1-foot}
      notes.push({t,l});
    }
  }
  notes.sort((a,b)=>a.t-b.t);
  const lastT=[-9,-9,-9,-9];notes=notes.filter(n=>{if(n.t-lastT[n.l]<0.085)return false;lastT[n.l]=n.t;return true});
  return{notes,music,vamp,beats,drums,counts,beat,end:notes[notes.length-1].t+1.3};
}

function drawDancer(cv,L,pose={}){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}

  const s=Math.min(W/200,H/320)*dpr;x.setTransform(s,0,0,s,(cv.width-200*s)/2,(cv.height-320*s)/2);

  x.fillRect(95,68,10,16);
  if(L.wig==='ringlet'){x.fillStyle=L.hair;for(const cx of[78,84,116,122])for(let y=48;y<=110;y+=8){x.beginPath();x.arc(cx+(y%16?2:-2),y,5.4,0,7);x.fill()}}
  x.fillStyle=L.skin;x.beginPath();x.arc(100,55,17,0,7);x.fill();
  x.fillStyle='#2a1a1a';x.beginPath();x.arc(94,56,1.6,0,7);x.arc(106,56,1.6,0,7);x.fill();
  x.strokeStyle='#8a3a3a';x.lineWidth=1.4;x.beginPath();x.arc(100,60,5,0.2*Math.PI,0.8*Math.PI);x.stroke();
  x.fillStyle=L.hair;
  if(L.wig==='bun'){x.beginPath();x.arc(100,52,18,Math.PI*1.03,Math.PI*1.97);x.fill();x.beginPath();x.arc(100,33,8,0,7);x.fill()}
  else{
    const curls=[];for(let a=Math.PI*0.92;a<=Math.PI*2.08;a+=0.24)curls.push([100+Math.cos(a)*19,54+Math.sin(a)*19]);
    if(L.wig==='short'){curls.push([80,64],[120,64],[82,72],[118,72])}
    if(L.wig==='bunwig'){curls.push([94,30],[106,30],[100,24],[90,36],[110,36],[100,34])}
    if(L.wig==='ringlet'){curls.push([94,32],[106,32],[100,30])}
    for(const[cx,cy]of curls){x.beginPath();x.arc(cx,cy,6,0,7);x.fill()}
    x.strokeStyle='rgba(255,255,255,0.18)';x.lineWidth=1;for(const[cx,cy]of curls){x.beginPath();x.arc(cx-1,cy-1,3,3.6,5.4);x.stroke()}
  }
  // headpiece
  const hp=L.head;
  if(hp.style==='band'||hp.style==='cband'){x.strokeStyle=hp.style==='cband'?'#e8eef7':dr.base;x.lineWidth=4;x.beginPath();x.arc(100,55,20,Math.PI*1.12,Math.PI*1.88);x.stroke();
    if(hp.style==='cband'){x.fillStyle='#bfe9ff';for(let a=1.18;a<1.86;a+=0.12){x.beginPath();x.arc(100+Math.cos(a*Math.PI)*20,55+Math.sin(a*Math.PI)*20,1.6,0,7);x.fill()}}}
  if(hp.style==='tiara'||hp.style==='crown'){const tall=hp.style==='crown'?12:7;x.fillStyle=hp.col;x.beginPath();x.moveTo(84,38);
    for(let i=0;i<=8;i++){const px=84+i*4,py=i%2?38-tall+(i===4?-3:0):36;x.lineTo(px,py)}x.lineTo(116,40);x.quadraticCurveTo(100,35,84,40);x.closePath();x.fill();
    x.fillStyle=hp.style==='crown'?'#ef4f72':'#bfe9ff';for(let i=1;i<8;i+=2){x.beginPath();x.arc(84+i*4,38-tall+3,1.5,0,7);x.fill()}}
  x.restore();
}

let TAB='board',BOARD=[],RUN=null,P=null;
function go(fn,...a){if(P)stopPlay();fn(...a);window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='mute'){muted=!muted;b.textContent=muted?'Sound off':'Sound on';b.setAttribute('aria-pressed',muted);if(master)master.gain.value=muted?0:0.9;return}
  if(a==='home'){if(P)return;S?go(hub):go(title);return}
  if(a==='tab'){TAB=b.dataset.tab;hub();return}
  if(a==='enter'){enter(BOARD[+b.dataset.i]);return}
  if(a==='practice'){const k=$('#prk').value;enter({kind:'practice',key:k,lv:Math.min(S.grade,5),fee:0,piece:k==='set'?tradPiece(Math.min(S.grade,3)):null,feis:'Practice room'});return}
  if(a==='wear'){const it=IT[b.dataset.id];if(it.solo&&S.grade<2){toast('Solo dresses are worn from Novice up. Beginners dance in the class costume.');return}S.eq[it.slot]=it.id;save();hub();return}
  if(a==='buy'){const it=IT[b.dataset.id];if(S.crystals<it.price)return toast('Not enough crystals yet.');S.crystals-=it.price;S.owned.push(it.id);if(!(it.solo&&S.grade<2))S.eq[it.slot]=it.id;save();toast(`${it.name} is in your closet.`);hub();return}
  if(a==='continue'){S=load();updateTop();TAB=S.studio?'studio':'board';go(hub);return}
  if(a==='quit'){if(b.dataset.armed){stopPlay();RUN=null;hub();toast('You left the stage. The entry fee is not refunded.')}else{b.dataset.armed='1';b.textContent='Tap again to quit'}return}
  if(a==='next'){playRound();return}
  if(a==='back'){go(hub);return}
  if(a==='champstart'){const c=RUN_PENDING;const soft=document.querySelector('input[name=soft]:checked').value,hard=document.querySelector('input[name=hard]:checked').value;c.rounds=[{key:soft},{key:hard},{key:'set',piece:c.piece}];begin(c);return}
  if(a==='teach'){teach($('#tk').value);return}
  if(a==='weekend'){weekend();return}
  if(a==='recruit'){recruit();return}
  if(a==='reset'){if(b.dataset.armed){try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;updateTop();title()}else{b.dataset.armed='1';b.textContent='Tap again to erase this dancer'}return}
});

  if(g===4)return`<p>Win a Preliminary Championship overall to move up to Open Championship.</p>`;

function makeField(c){

const perf=st=>st.tech+presence();
function champStand(R){

/* ---------- the dance itself ---------- */
const LC=['#a9e4ff','#ef7aa0','#e2b95c','#7ee0a6'];
const KEYMAP={KeyA:0,ArrowLeft:0,KeyS:1,ArrowDown:1,KeyK:2,ArrowUp:2,KeyL:3,ArrowRight:3};
function play(sp,lv,eyebrow,done){
  ensureAudio();
  const ch=buildChart(sp,lv,(Math.random()*1e9)|0);
  const labels=sp.shoe==='soft'?['Left','Right','Leap','Point']:['Left','Right','Treble','Click'];
  const keys=['A','S','K','L'];
  app.innerHTML=`<section>
    <div class="play-head"><div><p class="eyebrow">${esc(eyebrow)}</p><h2>${esc(sp.name)}</h2><p class="muted">${sp.label} · ${sp.meter} · ${sp.bpm} bpm</p></div>
      <div class="hud"><div><span>Combo</span><b id="hc">0</b></div><div><span>On beat</span><b id="ha">—</b></div><button class="btn ghost small" data-act="quit">Leave stage</button></div></div>
    <canvas id="stagecv" aria-label="Your dancer on stage"></canvas><canvas id="lanes" aria-label="Step lanes"></canvas>
    <div class="pads">${labels.map((l,i)=>`<button class="pad" data-lane="${i}" style="border-color:${hexA(LC[i],.5)}"><span style="color:${LC[i]}">${l}<small>${keys[i]}</small></span></button>`).join('')}</div>
    <p class="keys">Hit each step as it crosses the gold line. Keys A S K L, arrow keys, or tap the pads.</p></section>`;
  const win=[.055,.1,.15].map(w=>w*[1.25,1.18,1.1,1.05,1,1,1][lv]);
  P={sp,ch,lv,done,win,travel:[1.8,1.7,1.6,1.5,1.4,1.3,1.25][lv],t0:ac.currentTime+0.6,mi:0,bi:0,di:0,scan:0,hits:{perfect:0,great:0,good:0,miss:0},sum:0,judged:0,combo:0,maxCombo:0,press:[0,0,0,0],fl:[],pose:{l:0,r:0,leap:0},cv:$('#lanes'),stage:$('#stagecv'),banner:(RUN&&RUN.comp&&RUN.comp.feis)||'Feis',raf:0};
  P.cx=P.cv.getContext('2d');
  P.onKey=e=>{if(e.repeat)return;const l=KEYMAP[e.code];if(l===undefined)return;e.preventDefault();hit(l)};
  window.addEventListener('keydown',P.onKey);
  document.querySelectorAll('.pad').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.lane)}));
  P.cv.addEventListener('pointerdown',e=>{const r=P.cv.getBoundingClientRect();hit(Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4))))});

function stopPlay(){if(!P)return;cancelAnimationFrame(P.raf);window.removeEventListener('keydown',P.onKey);P=null}
function judge(n,q){

  P.fl.push({text:q==='miss'?'Miss':q[0].toUpperCase()+q.slice(1),l:n.l,t:performance.now(),c:q==='perfect'?'#f6dd9c':q==='great'?'#a9e4ff':q==='good'?'#b3a8c4':'#ff8f7f'});

}
function hit(l){
  if(!P)return;const now=ac.currentTime-P.t0;P.press[l]=1;
  const pad=document.querySelector(`.pad[data-lane="${l}"]`);if(pad){pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),90)}
  tap(P.sp.shoe==='hard',l);
  if(l===0)P.pose.l=1;else if(l===1)P.pose.r=1;else if(l===2&&P.sp.shoe==='soft')P.pose.leap=1;else{P.pose.l=.6;P.pose.r=.6}

function frame(){

function drawLanes(now){

  x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle='#1a1427';x.fillRect(0,0,W,H);
  const lw=W/4,hitY=H-54,tr=P.travel,ys=t=>hitY-(t-now)/tr*hitY;
  for(let i=0;i<4;i++){
    x.fillStyle=i%2?'rgba(255,255,255,0.025)':'rgba(0,0,0,0.08)';x.fillRect(i*lw,0,lw,H);
    x.strokeStyle='rgba(255,255,255,0.05)';x.beginPath();x.moveTo(i*lw+.5,0);x.lineTo(i*lw+.5,H);x.stroke();
    if(P.press[i]>0.02){const g=x.createLinearGradient(0,hitY,0,hitY-180);g.addColorStop(0,hexA(LC[i],.32*P.press[i]));g.addColorStop(1,hexA(LC[i],0));x.fillStyle=g;x.fillRect(i*lw,hitY-180,lw,180)}

  x.strokeStyle='#e2b95c';x.lineWidth=3;x.beginPath();x.moveTo(0,hitY);x.lineTo(W,hitY);x.stroke();
  for(let i=0;i<4;i++){const cx=i*lw+lw/2;x.strokeStyle=hexA(LC[i],.55+.45*P.press[i]);x.lineWidth=2;x.beginPath();x.arc(cx,hitY,Math.min(20,lw*.28),0,7);x.stroke()}
  const soft=P.sp.shoe==='soft';
  for(let k=P.scan;k<P.ch.notes.length;k++){
    const n=P.ch.notes[k];if(n.t>now+tr)break;if(n.j)continue;const y=ys(n.t),cx=n.l*lw+lw/2,col=LC[n.l],rr=Math.min(18,lw*.26);
    x.fillStyle=col;x.shadowColor=col;x.shadowBlur=10;x.beginPath();
    if(n.l<2){const w=Math.min(lw*.62,64);x.roundRect?x.roundRect(cx-w/2,y-8,w,16,8):x.rect(cx-w/2,y-8,w,16)}
    else if(n.l===2){const s=soft?rr:rr*.75;x.moveTo(cx,y-s);x.lineTo(cx+s,y);x.lineTo(cx,y+s);x.lineTo(cx-s,y);x.closePath()}
    else if(soft){x.moveTo(cx,y+rr*.8);x.lineTo(cx+rr*.85,y-rr*.6);x.lineTo(cx-rr*.85,y-rr*.6);x.closePath()}
    else{x.arc(cx,y,rr*.75,0,7)}
    x.fill();x.shadowBlur=0;
    x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(cx,y,3,0,7);x.fill();
  }
  const pn=performance.now();P.fl=P.fl.filter(f=>pn-f.t<550);
  x.textAlign='center';x.font='700 15px Figtree, system-ui, sans-serif';
  for(const f of P.fl){const a=1-(pn-f.t)/550;x.fillStyle=hexA(f.c,a);x.fillText(f.text,f.l*lw+lw/2,hitY-30-(1-a)*24)}
  const b=P.ch.beat;
  if(now<(P.ch.counts[0]?.t??0)){x.fillStyle='rgba(244,237,224,.75)';x.font='22px "Uncial Antiqua", Georgia, serif';x.fillText('Point your toe…',W/2,H*.38)}
  for(const ct of P.ch.counts){if(now>=ct.t&&now<ct.t+b){const a=1-(now-ct.t)/b;x.fillStyle=hexA('#f6dd9c',.35+.65*a);x.font=`${Math.round(64+16*a)}px "Uncial Antiqua", Georgia, serif`;x.fillText(ct.label,W/2,H*.4)}}
}

function drawStage(now){
  const c=P.stage,x=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const back=H*0.5,cw=Math.max(24,W*0.07);let g;
  g=x.createLinearGradient(0,0,0,back);g.addColorStop(0,'#120d1f');g.addColorStop(1,'#241a3a');x.fillStyle=g;x.fillRect(0,0,W,back);
  const bw=Math.min(W*0.5,380),bh=Math.max(24,H*0.14),bx=W/2-bw/2,by=H*0.17;
  x.fillStyle='#1d5a46';x.fillRect(bx,by,bw,bh);x.strokeStyle='#e2b95c';x.lineWidth=2;x.strokeRect(bx+3,by+3,bw-6,bh-6);
  x.fillStyle='#f6dd9c';x.font=`${Math.round(bh*0.48)}px "Uncial Antiqua", Georgia, serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(P.banner,W/2,by+bh/2+1,bw-20);
  const lx=cw+W*0.05,rx=W-cw-W*0.05;
  g=x.createLinearGradient(0,back,0,H);g.addColorStop(0,'#5e3b21');g.addColorStop(1,'#a06a3c');x.fillStyle=g;
  x.beginPath();x.moveTo(lx,back);x.lineTo(rx,back);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
  x.lineWidth=1;x.strokeStyle='rgba(40,22,10,0.45)';for(let i=1;i<16;i++){const t=i/16;x.beginPath();x.moveTo(lx+(rx-lx)*t,back);x.lineTo(W*t,H);x.stroke()}
  x.strokeStyle='rgba(40,22,10,0.22)';for(let i=1;i<5;i++){const y=back+(H-back)*Math.pow(i/5,1.6);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  const beat=P.ch.beat,barDur=beat*P.sp.bpb,first=P.ch.notes[0]?P.ch.notes[0].t:0;
  const dancing=now>=first-0.05&&now<P.ch.end-1.2;
  const tr=dancing?Math.sin((now-first)/(barDur*4)*Math.PI*2):0;
  const px=W/2+tr*(W*0.24),floorY=back+(H-back)*0.8;
  g=x.createLinearGradient(0,0,0,floorY);g.addColorStop(0,'rgba(255,240,205,0.02)');g.addColorStop(1,'rgba(255,240,205,0.15)');x.fillStyle=g;
  x.beginPath();x.moveTo(px-12,0);x.lineTo(px+12,0);x.lineTo(px+H*0.32,floorY);x.lineTo(px-H*0.32,floorY);x.closePath();x.fill();
  g=x.createRadialGradient(px,floorY,2,px,floorY,H*0.4);g.addColorStop(0,'rgba(255,236,190,0.38)');g.addColorStop(1,'rgba(255,236,190,0)');x.fillStyle=g;x.beginPath();x.ellipse(px,floorY,H*0.4,H*0.09,0,0,7);x.fill();
  let al=0,ar=0,hop=0;
  if(dancing){const ph=now/beat,bi=Math.floor(ph),f=ph-bi,amt=0.38*(1-f);if(bi%2)ar=amt;else al=amt;hop=Math.sin(f*Math.PI)*0.12}
  const pose={l:Math.max(al,P.pose.l),r:Math.max(ar,P.pose.r),leap:Math.max(hop,P.pose.leap)};
  const s=H*0.8/320;x.save();x.translate(px-100*s,floorY-300*s);x.scale(s,s);paintDancer(x,look(),pose);x.restore();
  for(const side of[0,1]){const x0=side?W-cw:0;g=x.createLinearGradient(x0,0,x0+cw,0);for(let i=0;i<=4;i++)g.addColorStop(i/4,i%2?'#4e0f22':'#8a1d3a');x.fillStyle=g;x.beginPath();
    if(side){x.moveTo(W,0);x.lineTo(W-cw,0);x.quadraticCurveTo(W-cw*0.6,H*0.6,W-cw*0.2,H);x.lineTo(W,H)}else{x.moveTo(0,0);x.lineTo(cw,0);x.quadraticCurveTo(cw*0.6,H*0.6,cw*0.2,H);x.lineTo(0,H)}x.closePath();x.fill()}
  const vh=H*0.1,sc=Math.max(6,Math.round(W/60)),sw=W/sc;x.fillStyle='#7a1934';x.fillRect(0,0,W,vh);
  const scallop=()=>{x.beginPath();for(let i=0;i<sc;i++){x.moveTo(i*sw,vh);x.quadraticCurveTo(i*sw+sw/2,vh+H*0.07,(i+1)*sw,vh)}};
  scallop();x.fill();scallop();x.strokeStyle='#e2b95c';x.lineWidth=2;x.stroke();
  for(let i=0;i<10;i++){const fx=W*(0.08+i*0.093);g=x.createRadialGradient(fx,H-2,0,fx,H-2,14);g.addColorStop(0,'rgba(255,225,160,.9)');g.addColorStop(1,'rgba(255,225,160,0)');x.fillStyle=g;x.fillRect(fx-14,H-16,28,16)}
  const tw=Math.min(W*0.2,150),th=H*0.17,tx=W-cw-tw-6,ty=H-th;
  x.fillStyle='#120c16';x.beginPath();x.arc(tx+tw*0.5,ty-th*0.5,th*0.3,0,7);x.fill();x.fillRect(tx+tw*0.5-th*0.48,ty-th*0.28,th*0.96,th*0.4);
  x.fillStyle='#2a1d14';x.fillRect(tx,ty,tw,th);x.fillStyle='#e2b95c';x.fillRect(tx,ty,tw,2);x.fillStyle='rgba(255,246,225,.85)';x.fillRect(tx+tw*0.12,ty-3,tw*0.22,3);
  x.fillStyle='rgba(244,237,224,.65)';x.font=`700 ${Math.max(8,Math.round(th*0.2))}px Figtree, system-ui, sans-serif`;x.fillText('ADJUDICATOR',tx+tw/2,ty+th*0.58);
}

/* ---------- studio ---------- */
function found(){
  app.innerHTML=`<section class="panel center"><p class="eyebrow">TCRG · Teacher</p><h2 style="font-size:40px;color:var(--gold2);margin-top:4px">Name your studio</h2>
  <p style="margin-top:10px">Your students will dance under this name at every feis. Three beginners are already waiting at the door, and the feis committee has sent 200 ✦ to help you set up.</p>
  <form id="sf" style="display:grid;gap:12px;margin-top:16px"><label for="snm" style="font-weight:700">Studio name</label><input type="text" id="snm" maxlength="32" value="${esc(S.name.split(' ')[0])} Academy of Irish Dance" style="padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)"><div><button class="btn" type="submit">Open the doors</button></div></form></section>`;
  $('#sf').addEventListener('submit',e=>{e.preventDefault();const nm=$('#snm').value.trim()||'My Academy';
    S.studio={name:nm,rep:10,students:[],week:1,taught:false,log:['You opened the studio. Teach a class, then take your dancers to a feis.'],ms:[],cab:[]};
    for(let i=0;i<3;i++)S.studio.students.push(mkStudent());S.crystals+=200;TAB='studio';save();hub()});
}
function mkStudent(){const st=S.studio;return{n:`${pick(FIRST)} ${String.fromCharCode(65+Math.floor(Math.random()*26))}.`,g:0,sk:58+Math.random()*6+(st?st.rep/12:0),w:[]}}
const maxStudents=()=>3+Math.floor(S.studio.rep/12);
const MILESTONES=[['ab','A student moves up to Advanced Beginner'],['five','Five students on the roster'],['nov','A student reaches Novice'],['pc','A student reaches Preliminary Championship'],['ten','Ten students on the roster'],['oc','A student wins an Open Championship']];
function checkMs(){const st=S.studio,has=k=>st.ms.includes(k),add=(k,msg)=>{if(!has(k)){st.ms.push(k);st.log.unshift('Milestone: '+msg)}};
  if(st.students.some(s=>s.g>=1))add('ab','first Advanced Beginner');if(st.students.length>=5)add('five','five students');if(st.students.some(s=>s.g>=2))add('nov','first Novice');if(st.students.some(s=>s.g>=4))add('pc','first championship dancer');if(st.students.length>=10)add('ten','ten students');}
function studioHTML(){
  const st=S.studio;const champ=st.ms.includes('oc');
  return`${champ?`<div class="panel" style="border-color:var(--gold);margin-bottom:14px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:center">${trophySVG('perpetual',1)}<div><p class="eyebrow">Hall of fame</p><h3 style="font-size:24px;color:var(--gold2)">${esc(st.name)} has an Open Champion</h3><p class="muted">From a Beginner reel to a studio that makes champions. Keep teaching for as long as you like.</p></div></div>`:''}
  <div class="studio-top"><span class="chip">${esc(st.name)}</span><span class="chip">Week <span class="mono">${st.week}</span></span><span class="chip">Reputation <span class="mono">${st.rep}</span></span><span class="chip">Students <span class="mono">${st.students.length}/${maxStudents()}</span></span></div>
  <div class="acts">
    <div class="act"><h4>Teach a class</h4><p>Dance the demonstration yourself. The cleaner your timing, the more every student improves. One class a week.</p><select id="tk" aria-label="Dance to teach">${DANCE_KEYS.map(k=>`<option value="${k}">${k==='set'?'Job of Journeywork':D[k].name}</option>`).join('')}</select><button class="btn small" data-act="teach" ${st.taught?'disabled':''}>${st.taught?'Taught this week':'Teach class'}</button></div>
    <div class="act"><h4>Feis weekend</h4><p>Enter every student at their grade. Tuition is <span class="mono">20 ✦</span> per student, entries cost <span class="mono">10 ✦</span> each.</p><button class="btn small" data-act="weekend">Go to ${esc(feisName())}</button></div>
    <div class="act"><h4>Recruit a dancer</h4><p>Costs <span class="mono">80 ✦</span> for shoes and a class costume. Higher reputation brings stronger beginners and more room.</p><button class="btn small" data-act="recruit" ${st.students.length>=maxStudents()?'disabled':''}>${st.students.length>=maxStudents()?'Studio full':'Recruit'}</button></div>
  </div>
  <div class="two">
    <div class="panel" style="padding:14px"><h4 style="margin:0 0 6px">Students</h4><div class="tablewrap" style="margin-top:0"><table><thead><tr><th>Dancer</th><th>Grade</th><th>Skill</th><th class="n">Next grade</th></tr></thead><tbody>${st.students.map(s=>`<tr><td>${esc(s.n)}</td><td>${GRADES[s.g].replace(' Championship',' Champ')}</td><td><span class="bar"><i style="width:${Math.min(100,(s.sk-55)/40*100)}%"></i></span><span class="mono">${s.sk.toFixed(0)}</span></td><td class="n">${s.g<5?s.w.length+'/'+(s.g<4?WIN_NEED[s.g]:1):'—'}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel" style="padding:14px;display:grid;gap:14px;align-content:start"><div><h4 style="margin:0 0 8px">Studio milestones</h4><ul class="ms">${MILESTONES.map(([k,l])=>`<li class="${st.ms.includes(k)?'ok':''}">${l}</li>`).join('')}</ul></div><div><h4 style="margin:0 0 6px">Studio news</h4><div class="log">${st.log.slice(0,12).map(l=>`<p>${esc(l)}</p>`).join('')}</div></div></div>
  </div>`;
}
function teach(key){
  const st=S.studio;if(st.taught)return;
  RUN={comp:{kind:'teach',lv:5,title:'Studio class',feis:st.name,rounds:[{key,piece:TRAD_SETS[3]}]},i:0,stats:[]};
  const sp=spec(key,5,TRAD_SETS[3]);
  go(()=>play(sp,5,`Demonstration · ${st.name}`,res=>{
    let tot=0;for(const s of st.students){const g=(0.6+3.2*res.acc)*Math.max(0.15,(96-s.sk)/30);s.sk=Math.min(97,s.sk+g);tot+=g}
    st.taught=true;st.log.unshift(`Week ${st.week}: you taught the ${sp.name} at ${Math.round(res.acc*100)}% on the beat. Students gained ${(tot/Math.max(1,st.students.length)).toFixed(1)} skill on average.`);
    RUN=null;save();TAB='studio';hub();toast('Class dismissed. Your dancers are sharper.');
  }));
}
function recruit(){const st=S.studio;if(st.students.length>=maxStudents())return toast('Build reputation to make room for more dancers.');if(S.crystals<80)return toast('Recruiting costs 80 ✦.');S.crystals-=80;const s=mkStudent();st.students.push(s);st.log.unshift(`${s.n} joined the studio as a Beginner.`);checkMs();save();hub()}
function weekend(){
  const st=S.studio,f=feisName(),lines=[];let earn=0,fees=0;
  for(const s of st.students){
    fees+=10;earn+=20;const g=s.g,n=g<4?[10,12,14,16][g]:g===4?18:22;
    const me=s.sk+gauss()*4;let beat=0;for(let i=0;i<n-1;i++)if(MEAN[g]+gauss()*5>me)beat++;const place=beat+1;
    s.sk=Math.min(97,s.sk+0.4);
    const comp=g<4?pick(g<2?DANCE_KEYS.slice(0,5):DANCE_KEYS.filter(k=>g<3||k!=='light')):'champ';const ttl=g<4?`${GRADES[g]} ${comp==='set'?'Trad Set':D[comp].name}`:GRADES[g];
    if(place===1){earn+=12;st.rep+=3;st.cab.push({kind:g>=4?'perpetual':'cup',place:1,title:ttl,sub:`${s.n} · ${f}`});lines.push(`${s.n} won the ${ttl}!`)}
    else if(place<=3){st.rep+=1;lines.push(`${s.n} placed ${ord(place)} in the ${ttl}.`)}
    if((g<2?place<=3:place===1)&&!s.w.includes(comp))s.w.push(comp);
    if(g<5&&s.w.length>=(g<4?WIN_NEED[g]:1)){s.g++;s.w=[];st.rep+=6;lines.push(`${s.n} moves up to ${GRADES[s.g]}.`)}
    if(g===5&&place===1&&!st.ms.includes('oc')){st.ms.push('oc');st.rep+=20;lines.push(`${s.n} is an Open Champion! Your studio has made a champion.`)}
  }
  S.crystals+=earn-fees;
  st.log.unshift(...lines.reverse(),`Week ${st.week} at ${f}: ${st.students.length} dancers entered. Tuition and prizes ${earn} ✦, entries ${fees} ✦.`);
  st.week++;st.taught=false;S.week++;checkMs();save();TAB='studio';hub();
  toast(lines.length?lines[lines.length-1]:'A quiet weekend. More classes will bring more medals.');
}

/* ---------- boot ---------- */
window.addEventListener('resize',()=>{const c=$('#hdancer');if(c&&S)drawDancer(c,look(),{})});
document.fonts&&document.fonts.ready.then(()=>{const c=$('#hdancer');if(c&&S)drawDancer(c,look(),{})});
title();
</script>
